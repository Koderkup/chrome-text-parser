<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Копипастер</title>
  <style>

  body {
    width: 300px;
    height: 150px;
    margin: 10;
    padding: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;  
    
  }

  .container {
    width: 100%;
    height: 100%;
    position: relative;
    border: 1.5px #28344F solid;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  header {
  width: 100%;
  background-color: #28344F;
  height: 50px;
  display: flex;
  flex-flow: row nowrap;
  align-items: center;
  justify-content: space-around;

  }

  #heading {
  color: white;
  font-size: 20px;
  margin-left: -10px;
  }

main {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 0 !important;
}

#off {
width: 40px;
height: 40px;
}

footer {
position: absolute;
bottom: 0;
width: 100%;
height: 30px;
display: flex;
align-items: center;
justify-content: flex-end;

}
.switch {
  margin-right: 10px;
  position: relative;
  display: inline-block;
  width: 50px;
  height: 24px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: .3s;
  border-radius: 24px;
  color: blue;
  font-size: 11px;
  display: flex;
  align-items: center;
  padding-left: 24px;
  color: green;
}


.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .3s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: #4CAF50;
  padding-left: 8px;
  color: white;
}

input:checked + .slider:before {
  transform: translateX(26px);
}


</style>

</head>
<body>
  <div class="container">
    <header>
    <img id="logo" src="/icons/icon-32.png" alt="logo">
    <span id="heading"><i>Копипастер hh.ru<i></span>
    </header>
    <main>
    <h3 id="h3"></h3>
</main>
  <footer>
  <label class="switch">
  <input type="checkbox" id="checkbox">
  <span class="slider"></span>
</label>
</footer>

   
  </div>
<script src="../js/popup.js"></script>
</body>
</html>
